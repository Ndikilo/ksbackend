name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    env:
      APP_ENV: ci

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Supply-chain audit. NON-BLOCKING for now (continue-on-error) so known
      # advisories can be triaged without stalling the pipeline; flip it to
      # blocking by removing that flag once the current list is clean — keep
      # `--audit-level=high` so only known highs/criticals gate the build.
      - name: Supply-chain audit (bun audit)
        run: bun audit --audit-level=high
        continue-on-error: true

      - name: Lint (oxlint)
        run: bun run lint

      - name: Format check (oxfmt)
        run: bun run format:check

      - name: Type-check (tsc)
        run: bun run typecheck

      - name: Structure / naming / import-boundary check
        run: bun run check:structure

      - name: Migration drift check
        # The committed migrations must fully reflect src/db/schema — if
        # drizzle-kit generates anything new, someone forgot `bun run db:generate`.
        env:
          DATABASE_URL: postgres://drift:check@localhost:5432/drift
        run: |
          bun run db:generate
          if [ -n "$(git status --porcelain drizzle)" ]; then
            echo "::error::Schema drift detected — run 'bun run db:generate' and commit the migration."
            git status --porcelain drizzle
            exit 1
          fi

      - name: Test (vitest — unit + api, with coverage)
        env:
          # CI has no developer .env; the harness boots the real env loaders.
          EMAIL_FROM: "KanaSante CI <ci@example.invalid>"
        run: bun run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

      # Integration tests provision their own Postgres via Testcontainers
      # (Docker is available on ubuntu-latest by default).
      - name: Integration tests (Testcontainers)
        run: bun run test:integration

  # The deploy artifact is always build-tested; never pushed (P0.T8).
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build production image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: ksbackend-ci:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=min
