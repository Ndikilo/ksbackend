name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    env:
      APP_ENV: ci

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint (oxlint)
        run: bun run lint

      - name: Format check (oxfmt)
        run: bun run format:check

      - name: Type-check (tsc)
        run: bun run typecheck

      - name: Structure / naming / import-boundary check
        run: bun run check:structure

      - name: Migration drift check
        # The committed migrations must fully reflect src/db/schema — if
        # drizzle-kit generates anything new, someone forgot `bun run db:generate`.
        env:
          DATABASE_URL: postgres://drift:check@localhost:5432/drift
        run: |
          bun run db:generate
          if [ -n "$(git status --porcelain drizzle)" ]; then
            echo "::error::Schema drift detected — run 'bun run db:generate' and commit the migration."
            git status --porcelain drizzle
            exit 1
          fi

      - name: Test (vitest — unit + api)
        run: bun run test

      # Integration tests provision their own Postgres via Testcontainers
      # (Docker is available on ubuntu-latest by default).
      - name: Integration tests (Testcontainers)
        run: bun run test:integration
