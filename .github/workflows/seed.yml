# One-off: seed the hosted (Render) database — professions, languages, and the
# admin account. Run manually from the Actions tab (Run workflow). Credentials
# come from repo secrets (SEED_DATABASE_URL, SEED_ADMIN_EMAIL, SEED_ADMIN_PASSWORD).
name: Seed hosted database

on:
  workflow_dispatch:

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run seed
        env:
          DATABASE_URL: ${{ secrets.SEED_DATABASE_URL }}
          ADMIN_SEED_EMAIL: ${{ secrets.SEED_ADMIN_EMAIL }}
          ADMIN_SEED_PASSWORD: ${{ secrets.SEED_ADMIN_PASSWORD }}
        run: bun run db:seed
